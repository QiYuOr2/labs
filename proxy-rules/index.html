<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>订阅链接</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #1c1c1c;
      background: #fff;
      font: 16px/1.4 "Songti SC", "Noto Serif SC", Palatino, serif;
    }
    main {
      width: min(760px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }
    h1 { margin: 0 0 16px; font-size: 22px; font-weight: 600; }
    textarea {
      width: 100%;
      min-height: 88px;
      max-height: 240px;
      padding: 10px;
      border: 1px solid #1c1c1c;
      resize: vertical;
      font: 14px/1.45 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    textarea.editing {
      min-height: 280px;
      max-height: 70vh;
    }
    #sheet { border: 1px solid #1c1c1c; background: #fff; }
    #sheet[hidden], textarea[hidden] { display: none; }
    .sheet-bar {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
      padding: 8px 10px;
      border-bottom: 1px solid #1c1c1c;
    }
    #meta { margin: 0; font-size: 14px; overflow-wrap: anywhere; }
    .sheet-actions { display: flex; gap: 8px; flex: none; }
    .sheet-actions button { padding: 4px 8px; }
    #preview {
      max-height: 320px;
      overflow: auto;
      background: #f7f5f0;
      font: 12px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    #preview.open { max-height: min(70vh, 720px); }
    .prow { display: grid; grid-template-columns: 3.5em max-content; min-width: 100%; }
    .ln {
      position: sticky;
      left: 0;
      color: #777;
      text-align: right;
      padding-right: 8px;
      background: #f7f5f0;
      user-select: none;
    }
    .code { white-space: pre; padding-right: 12px; }
    .gap { padding: 6px 10px; color: #555; background: #efeae2; }
    .clients { display: flex; gap: 8px; margin-top: 12px; }
    button, .file {
      border: 1px solid #1c1c1c;
      background: #fff;
      color: #1c1c1c;
      font: inherit;
      padding: 8px 12px;
      cursor: pointer;
    }
    .file input { display: none; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    .clients button[aria-pressed="true"] { background: #1c1c1c; color: #fff; }
    #warning { min-height: 1.2em; margin: 8px 0 0; color: #9d2c2c; }
    #result { margin-top: 20px; }
    #result[hidden] { display: none; }
    #hint { margin: 0 0 12px; }
    .linkrow { display: flex; gap: 8px; align-items: flex-start; }
    #link {
      flex: 1;
      margin: 0;
      padding: 10px;
      overflow-wrap: anywhere;
      border: 1px solid #ccc;
      font: 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    #qr { margin-top: 16px; }
    #qr svg { width: 220px; height: auto; }
    .qr-miss { margin: 0; color: #555; }
    @media (max-width: 640px) {
      .clients, .linkrow, .sheet-bar, .actions { flex-direction: column; }
      .sheet-actions { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <h1>订阅链接</h1>
    <form>
      <div id="composer">
        <textarea id="subscription" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="订阅链接，或拖入 Quantumult X / Shadowrocket / Clash 配置"></textarea>
        <div id="sheet" hidden>
          <div class="sheet-bar">
            <p id="meta"></p>
            <div class="sheet-actions">
              <button type="button" id="toggle">展开</button>
              <button type="button" id="edit">编辑</button>
              <button type="button" id="clear">清空</button>
            </div>
          </div>
          <div id="preview"></div>
        </div>
      </div>
      <div class="actions">
        <label class="file">选择文件<input id="file" type="file" accept=".conf,.txt,.yaml,.yml,.list"></label>
        <button type="button" id="make" hidden>生成</button>
      </div>
      <div class="clients" role="group" aria-label="客户端">
        <button type="button" data-client="qx" aria-pressed="true">Quantumult X</button>
        <button type="button" data-client="sr" aria-pressed="false">Shadowrocket</button>
        <button type="button" data-client="flclash" aria-pressed="false">FlClash</button>
      </div>
      <p id="warning"></p>
    </form>
    <section id="result" hidden>
      <p id="hint"></p>
      <div class="linkrow">
        <code id="link"></code>
        <button type="button" id="copy">复制</button>
      </div>
      <div id="qr"></div>
    </section>
  </main>
  <script src="assets/qrcode.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
