[custom]
; 规则源。go run ./cmd/render 生成 clients 下的三份配置。
; 不要把这个文件交给在线转换，也不要把机场订阅写进来。
; AI 组只能手动选节点。不要往下面那行加自动选择、故障转移、香港或默认代理。

; 局域网、误杀修正、国内服务白名单
